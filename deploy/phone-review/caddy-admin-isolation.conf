# GATED caddy.service drop-in, not a standalone unit or Caddyfile.
# Install as /etc/systemd/system/caddy.service.d/60-admin-isolation.conf
# ONLY after checking the installed unit's user, binary/config paths, existing
# RuntimeDirectory entries, and the companion runbook. No automatic TCP fallback.
# Merge into the ONE existing Caddyfile global block separately:
#     admin unix//run/caddy-admin/admin.sock
[Service]
RuntimeDirectory=caddy-admin
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=no
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --address unix//run/caddy-admin/admin.sock --force
