name: eBay smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "eBay environment to validate"
        type: choice
        options:
          - sandbox
          - production
        default: sandbox
  push:
    paths:
      - ".github/workflows/ebay-smoke.yml"
      - "scripts/validate_live_ebay.py"
      - "scripts/prepare_local_ui_check.py"
      - "scripts/check_local_review_flow.py"
      - "src/finder/**"
      - "functions/**"
      - "neon.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "config/monitors.toml"
      - "pyproject.toml"
      - "deployment/Dockerfile"
      - ".dockerignore"
      - "scripts/check_cloud_container.sh"
      - "scripts/discogs_*.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.environment == 'production' && 'finder-production-scan' || format('ebay-smoke-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.environment != 'production'
    name: validate (${{ inputs.environment || 'sandbox' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes run offline tests only during the zero-cost transition.
    # Both provider steps below are explicitly disabled before secret resolution.
    env:
      EBAY_ENVIRONMENT: ${{ inputs.environment || 'sandbox' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Finder
        run: python -m pip install -e '.[dev]'

      - name: Run offline tests
        run: |
          python -m pytest -q
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Test deletion endpoint
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Exercise local review UI without services
        env:
          EBAY_ENVIRONMENT: ''
          PYTHONPATH: src
        run: |
          python scripts/prepare_local_ui_check.py "$RUNNER_TEMP/finder-local-ui"
          node tests/test_local_ui.cjs "$RUNNER_TEMP/finder-local-ui/index.html" "$RUNNER_TEMP/finder-local-ui/snapshot.json"
          python scripts/check_local_review_flow.py

      - name: Exercise private Discogs rules and UI without providers
        env:
          EBAY_ENVIRONMENT: ''
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_discogs_listing.py tests/test_discogs_rules.py tests/test_discogs_web.py tests/test_cloud_app.py tests/test_discogs_monitor.py tests/test_execution_guard.py tests/test_discogs_cart_claims.py tests/test_discogs_candidate_pipeline.py
          python scripts/check_cloud_owner_flow.py
          node --test --test-concurrency=1 tests/test_discogs_cart_inspector.cjs tests/test_discogs_cart_prepare.cjs tests/test_discogs_cart_browser_adapter.cjs tests/test_discogs_listing_release_dom.cjs tests/test_discogs_listing_detail_dom.cjs tests/test_discogs_rule_cart_gate.cjs tests/test_discogs_no_order_rehearsal.cjs tests/test_discogs_hosted_readonly.cjs tests/test_discogs_hosted_browser_runtime.cjs tests/test_discogs_browser_memory.cjs tests/test_discogs_release_snapshot.cjs tests/test_discogs_hosted_cart_helper.cjs tests/test_discogs_empty_cart.cjs tests/test_discogs_hosted_order_commit.cjs tests/test_discogs_enhanced_checkout.cjs tests/test_discogs_guest_card_prepare.cjs tests/test_discogs_guest_cua_operator.cjs tests/test_discogs_guest_checkout_operator.cjs tests/test_operator_stdio_transport.cjs

      - name: Build and smoke-test isolated non-root cloud container
        run: bash scripts/check_cloud_container.sh

      - name: Verify ${{ env.EBAY_ENVIRONMENT }} secrets are configured
        if: ${{ false }}
        shell: bash
        env:
          EBAY_SANDBOX_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_ID || '' }}
          EBAY_SANDBOX_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_SECRET || '' }}
          EBAY_PRODUCTION_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_ID || '' }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_SECRET || '' }}
        run: |
          prefix="EBAY_${EBAY_ENVIRONMENT^^}_"
          missing=0
          for suffix in CLIENT_ID CLIENT_SECRET; do
            name="${prefix}${suffix}"
            if [[ -z "${!name}" ]]; then
              echo "${name} repository secret is not configured."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Run live eBay ${{ env.EBAY_ENVIRONMENT }} validation
        if: ${{ false }}
        shell: bash
        env:
          EBAY_SANDBOX_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_ID || '' }}
          EBAY_SANDBOX_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_SECRET || '' }}
          EBAY_PRODUCTION_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_ID || '' }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          python scripts/validate_live_ebay.py

  production:
    # Production validation is paused with all hosted jobs.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Validate Production with shared request debits
        env:
          EBAY_ENVIRONMENT: production
          EBAY_PRODUCTION_CLIENT_ID: ${{ secrets.EBAY_PRODUCTION_CLIENT_ID }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ secrets.EBAY_PRODUCTION_CLIENT_SECRET }}
          FINDER_DATABASE_URL: ${{ secrets.FINDER_DATABASE_URL }}
        run: python scripts/validate_live_ebay.py
