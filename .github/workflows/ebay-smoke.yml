name: eBay smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "eBay environment to validate"
        type: choice
        options:
          - sandbox
          - production
        default: sandbox
  push:
    paths:
      - ".github/workflows/ebay-smoke.yml"
      - "scripts/validate_live_ebay.py"
      - "src/finder/**"
      - "functions/**"
      - "neon.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "config/monitors.toml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ebay-smoke-${{ github.ref }}-${{ inputs.environment || 'sandbox' }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ inputs.environment || 'sandbox' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes always validate Sandbox; Production runs only on explicit manual dispatch.
    # Credentials are scoped to the live steps only; offline tests never see them, and only
    # the selected environment's keyset is ever exposed.
    env:
      EBAY_ENVIRONMENT: ${{ inputs.environment || 'sandbox' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Finder
        run: python -m pip install -e '.[dev]'

      - name: Run offline tests
        run: |
          python -m pytest -q
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Test deletion endpoint
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Verify ${{ env.EBAY_ENVIRONMENT }} secrets are configured
        shell: bash
        env:
          EBAY_SANDBOX_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_ID || '' }}
          EBAY_SANDBOX_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_SECRET || '' }}
          EBAY_PRODUCTION_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_ID || '' }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_SECRET || '' }}
        run: |
          prefix="EBAY_${EBAY_ENVIRONMENT^^}_"
          missing=0
          for suffix in CLIENT_ID CLIENT_SECRET; do
            name="${prefix}${suffix}"
            if [[ -z "${!name}" ]]; then
              echo "${name} repository secret is not configured."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Run live eBay ${{ env.EBAY_ENVIRONMENT }} validation
        shell: bash
        env:
          EBAY_SANDBOX_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_ID || '' }}
          EBAY_SANDBOX_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'sandbox' && secrets.EBAY_SANDBOX_CLIENT_SECRET || '' }}
          EBAY_PRODUCTION_CLIENT_ID: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_ID || '' }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ env.EBAY_ENVIRONMENT == 'production' && secrets.EBAY_PRODUCTION_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          python scripts/validate_live_ebay.py
