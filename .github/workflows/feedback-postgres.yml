name: Isolated PostgreSQL feedback checks

on:
  pull_request:
    paths:
      - '.github/workflows/feedback-postgres.yml'
      - 'src/finder/**'
      - 'functions/**'
      - 'scripts/check_*'
      - 'tests/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: feedback-postgres-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  feedback-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finder_ci
          POSTGRES_PASSWORD: finder_ci_ephemeral
          POSTGRES_DB: finder_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U finder_ci -d finder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci
      - name: Exercise owner endpoint and provider worker integration
        env:
          FINDER_REQUIRE_REFRESH_INTEGRATION: '1'
        run: python -m pytest -q tests/test_manual_refresh.py tests/test_manual_refresh_shutdown.py
      - name: Validate isolated target guard
        run: python -m pytest -q tests/test_isolated_postgres.py
      - name: Rehearse migration, restore, feedback and concurrent worker locking
        env:
          # Synthetic credentials work only on this job's disposable service container.
          FINDER_DATABASE_URL: postgresql://finder_ci:finder_ci_ephemeral@127.0.0.1:${{ job.services.postgres.ports[5432] }}/finder_ci
        run: python scripts/check_isolated_postgres.py
