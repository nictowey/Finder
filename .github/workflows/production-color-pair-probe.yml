name: Production color-pair pressing probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finder-production-scan
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EBAY_ENVIRONMENT: production
      DISCOGS_USER_AGENT: Finder/0.2 +https://github.com/nictowey/Finder

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install and test Finder offline
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Probe selected pressing with anonymous results
        env:
          EBAY_PRODUCTION_CLIENT_ID: ${{ secrets.EBAY_PRODUCTION_CLIENT_ID }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ secrets.EBAY_PRODUCTION_CLIENT_SECRET }}
          FINDER_DATABASE_URL: ${{ secrets.FINDER_DATABASE_URL }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          FINDER_TARGET_RELEASE_ID: ${{ secrets.FINDER_TARGET_RELEASE_ID }}
        run: |
          set -euo pipefail
          for name in EBAY_PRODUCTION_CLIENT_ID EBAY_PRODUCTION_CLIENT_SECRET FINDER_DATABASE_URL DISCOGS_TOKEN FINDER_TARGET_RELEASE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done
          python scripts/probe_color_pair.py
