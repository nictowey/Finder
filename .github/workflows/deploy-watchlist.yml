name: Deploy private watchlist

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-watchlist.yml'
      - 'functions/watchlist.ts'
      - 'functions/watchlist-ui.ts'
      - 'functions/inbox-query.ts'
      - 'functions/operations.ts'
      - 'functions/operations-query.ts'
      - 'scripts/run_watchlist.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: finder-production-scan
  cancel-in-progress: false

jobs:
  deploy:
    # Hosted execution is paused for the zero-cost transition; see docs/zero-cost-development.md.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finder_ci
          POSTGRES_PASSWORD: finder_ci_ephemeral
          POSTGRES_DB: finder_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U finder_ci -d finder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    environment: production
    env:
      FINDER_TRIGGER_SOURCE: deployment
      EBAY_ENVIRONMENT: production
      DISCOGS_USER_AGENT: Finder/0.3 +https://github.com/nictowey/Finder
      EBAY_PRODUCTION_CLIENT_ID: ${{ secrets.EBAY_PRODUCTION_CLIENT_ID }}
      EBAY_PRODUCTION_CLIENT_SECRET: ${{ secrets.EBAY_PRODUCTION_CLIENT_SECRET }}
      FINDER_DATABASE_URL: ${{ secrets.FINDER_DATABASE_URL }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      FINDER_GITHUB_DISPATCH_TOKEN: ${{ secrets.FINDER_GITHUB_DISPATCH_TOKEN }}
      FINDER_OWNER_EMAIL: ${{ secrets.FINDER_OWNER_EMAIL }}
      FINDER_SEED_RELEASES: ${{ secrets.FINDER_TARGET_RELEASE_ID }}
      EBAY_DELETION_VERIFICATION_TOKEN: ${{ secrets.EBAY_DELETION_VERIFICATION_TOKEN }}
      EBAY_DELETION_ENDPOINT_URL: https://br-soft-forest-b4fo15q2-ebaydeletion.compute.c-6.us-east-2.aws.neon.tech/
      FINDER_APP_ORIGIN: https://br-soft-forest-b4fo15q2-watchlist.compute.c-6.us-east-2.aws.neon.tech
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          ruff check src tests scripts
          ruff format --check src tests scripts
          npm ci
          npm test
          npm run typecheck
      - name: Verify isolated PostgreSQL migration and deletion
        env:
          # Rehearse on this job's disposable service, never the production host.
          FINDER_DATABASE_URL: postgresql://finder_ci:finder_ci_ephemeral@127.0.0.1:${{ job.services.postgres.ports[5432] }}/finder_ci
        run: python scripts/check_isolated_postgres.py
      - name: Verify bounded Monitoring history on isolated PostgreSQL
        env:
          FINDER_OPERATIONS_FIXTURE_URL: postgresql://finder_ci:finder_ci_ephemeral@127.0.0.1:${{ job.services.postgres.ports[5432] }}/finder_ci
        run: node --import tsx scripts/check_operations.ts
      - name: Migrate production schema without scanning
        run: python scripts/run_watchlist.py --migrate-only
      - name: Configure private authentication
        run: node scripts/configure_watchlist.mjs
      - name: Deploy dashboard
        run: |
          npm install --no-save neon@5.0.1
          if ! ./node_modules/.bin/neon deploy --project-id billowing-queen-56301477 --branch br-soft-forest-b4fo15q2 --no-env-pull --update-existing > neon-deploy.log 2>&1; then
            rm -f neon-deploy.log
            echo 'Deployment failed; response payloads withheld.'
            exit 1
          fi
          rm -f neon-deploy.log
      - name: Verify private access
        run: |
          node --input-type=module <<'JS'
          const base=process.env.FINDER_APP_ORIGIN;
          const home=await fetch(base);
          if(!home.ok || !(await home.text()).includes('Your pressing watchlist')) throw new Error('Dashboard unavailable');
          const data=await fetch(base+'/api/dashboard');
          if(![401,503].includes(data.status)) throw new Error('Unauthenticated access not blocked');
          const mutation=await fetch(base+'/api/watches',{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://example.com'},body:'{}'});
          if(mutation.status!==403) throw new Error('Cross-origin mutation not blocked');
          console.log('Dashboard reachable; anonymous and cross-origin data access blocked.');
          JS
