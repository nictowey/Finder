name: Private target evaluation panel

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Four private targets per batch, selected by their order in the secret
        required: true
        type: choice
        options: ['0', '1', '2']
      coverage_audit:
        description: Also sample a different search sort and second catalog artist
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: finder-private-target-panel
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      EBAY_ENVIRONMENT: production
      DISCOGS_USER_AGENT: Finder/0.3 +https://github.com/nictowey/Finder
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      EBAY_PRODUCTION_CLIENT_ID: ${{ secrets.EBAY_PRODUCTION_CLIENT_ID }}
      EBAY_PRODUCTION_CLIENT_SECRET: ${{ secrets.EBAY_PRODUCTION_CLIENT_SECRET }}
      FINDER_EVAL_RELEASE_IDS: ${{ secrets.FINDER_EVAL_RELEASE_IDS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Finder
        run: python -m pip install -e .

      - name: Measure four private targets without retaining listings
        env:
          TARGET_BATCH: ${{ inputs.batch }}
          COVERAGE_AUDIT: ${{ inputs.coverage_audit }}
        run: |
          set -euo pipefail
          if [ "$COVERAGE_AUDIT" = true ]; then
            python scripts/measure_private_target_panel.py --batch "$TARGET_BATCH" --coverage-audit
          else
            python scripts/measure_private_target_panel.py --batch "$TARGET_BATCH"
          fi
