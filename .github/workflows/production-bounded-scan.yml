name: Production bounded scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finder-production-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EBAY_ENVIRONMENT: production

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install and test Finder offline
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Scan bounded Production vinyl sample into shared Neon database
        env:
          EBAY_PRODUCTION_CLIENT_ID: ${{ secrets.EBAY_PRODUCTION_CLIENT_ID }}
          EBAY_PRODUCTION_CLIENT_SECRET: ${{ secrets.EBAY_PRODUCTION_CLIENT_SECRET }}
          FINDER_DATABASE_URL: ${{ secrets.FINDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in EBAY_PRODUCTION_CLIENT_ID EBAY_PRODUCTION_CLIENT_SECRET FINDER_DATABASE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}"
              exit 1
            fi
          done
          python scripts/validate_live_ebay.py --monitor rap-vinyl-validation
