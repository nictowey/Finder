name: Watch navigation browser checks
on:
  push:
    paths:
      - 'src/finder/discogs_watch_ui.py'
      - 'tests/watch_navigation_browser.mjs'
      - '.github/workflows/watch-navigation-browser.yml'
  pull_request:
    paths:
      - 'src/finder/discogs_watch_ui.py'
      - 'tests/watch_navigation_browser.mjs'
      - '.github/workflows/watch-navigation-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned browser test image
        run: docker build -f deployment/DeviceSessionBrowser.Dockerfile -t finder-navigation .
      - name: Test synthetic mobile navigation without network
        run: |
          mkdir -p browser-artifacts
          chmod 777 browser-artifacts
          timeout --signal=TERM --kill-after=10 180 docker run --rm --init \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            -v "$PWD/tests/watch_navigation_browser.mjs:/app/tests/watch_navigation_browser.mjs:ro" \
            -v "$PWD/browser-artifacts:/artifacts:rw" \
            finder-navigation node tests/watch_navigation_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-navigation-screenshots
          path: browser-artifacts
